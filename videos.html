<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow-plain">Videos</div>
    <h1>See it for yourself.</h1>
    <p style="max-width:56ch;color:rgba(239,231,214,0.72);margin-top:16px;">Dougie Joyce, the distillery, and the whiskey — straight from the source.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div id="video-grid" class="video-grid"></div>
    <div id="video-empty" class="video-empty" style="display:none;">
      New footage is on the way — check back soon.
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="/partials.js"></script>
<script>
(async function () {
  const grid = document.getElementById('video-grid');
  const empty = document.getElementById('video-empty');

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) {
      return '';
    }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function cardHTML(video) {
    return `
      <div class="video-card">
        <div class="video-frame">
          <video controls preload="metadata" playsinline src="/assets/videos/${encodeURIComponent(video.file)}"></video>
        </div>
        <div class="video-meta">
          <h3>${escapeHtml(video.title)}</h3>
          <div class="video-date">${formatDate(video.addedAt)}</div>
        </div>
      </div>
    `;
  }

  try {
    const res = await fetch('/assets/videos/manifest.json', { cache: 'no-store' });
    const videos = await res.json();

    if (!Array.isArray(videos) || !videos.length) {
      empty.style.display = 'block';
      return;
    }

    grid.innerHTML = videos.map(cardHTML).join('');
  } catch (e) {
    empty.style.display = 'block';
  }
})();
</script>
