<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | JIWhiskey</title>
<meta name="description" content="Get in touch with JIWhiskey.">
<link rel="canonical" href="https://www.jiwhiskey.co.uk/contact.html">
<meta property="og:url" content="https://www.jiwhiskey.co.uk/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Cinzel:wght@400;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow-plain">Contact</div>
    <h1>Get in touch.</h1>
  </div>
</section>

<section>
  <div class="wrap contact-grid">
    <form class="contact-form" onsubmit="return false;">
      <label for="name">Name</label>
      <input id="name" type="text" required>
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <label for="message">Message</label>
      <textarea id="message" rows="5" required></textarea>
      <button type="submit" class="btn">Send message</button>
    </form>
    <div class="contact-details">
      <div class="eyebrow-plain">Direct</div>
      <a href="tel:01613998731">0161 399 8731</a>
      <a href="mailto:hello@jiwhiskey.co.uk">hello@jiwhiskey.co.uk</a>
      <div class="eyebrow-plain" style="margin-top:30px;">Elsewhere</div>
      <a href="/socials.html">All socials</a>
      <a href="https://www.3dfightclubofficial.com/" target="_blank" rel="noopener">3D Fight Club</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="/partials.js"></script>
</body>
</html>
