<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#100D0A">
<meta property="og:type" content="website">
<meta property="og:site_name" content="JIWhiskey">
<meta property="og:title" content="Contact | JIWhiskey">
<meta property="og:description" content="Get in touch with JIWhiskey.">
<meta property="og:image" content="https://www.jiwhiskey.co.uk/assets/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Cinzel:wght@400;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow-plain">Contact</div>
    <h1>Get in touch.</h1>
  </div>
</section>

<section>
  <div class="wrap contact-grid">
    <form class="contact-form" id="contact-form">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <button type="submit" class="btn">Send message</button>
      <p id="contact-status" style="margin-top:16px;font-size:0.88rem;display:none;"></p>
    </form>
    <div class="contact-details">
      <div class="eyebrow-plain">Direct</div>
      <a href="tel:01613998731">0161 399 8731</a>
      <a href="mailto:hello@jiwhiskey.co.uk">hello@jiwhiskey.co.uk</a>
      <div class="eyebrow-plain" style="margin-top:30px;">Elsewhere</div>
      <a href="/socials.html">All socials</a>
      <a href="https://www.3dfightclubofficial.com/" target="_blank" rel="noopener">3D Fight Club</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="/partials.js"></script>
<script>
  document.getElementById('contact-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var form = e.target;
    var btn = form.querySelector('button[type="submit"]');
    var status = document.getElementById('contact-status');
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.style.display = 'none';
    try {
      var res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: form.name.value,
          email: form.email.value,
          message: form.message.value,
          _gotcha: form._gotcha.value
        })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      status.textContent = "Thanks, your message is in. We'll be in touch shortly.";
      status.style.color = '#8fbf8f';
      status.style.display = 'block';
      form.reset();
    } catch (err) {
      status.textContent = err.message;
      status.style.color = '#c96a5c';
      status.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });
</script>
</body>
</html>
